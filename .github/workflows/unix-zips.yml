name: macOS and Linux ZIPs

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python check_js.py
      - run: bash scripts/build_release_zip.sh linux
      - name: Verify release ZIP excludes archived UI
        run: python -c "from zipfile import ZipFile; z=ZipFile('dist/Lead-Extractor-linux.zip'); names=z.namelist(); assert not any(n.endswith('app.py') or '/archive/' in n or n.lower().endswith('.bat') for n in names); assert 'Lead-Extractor-linux/server.py' in names; assert 'Lead-Extractor-linux/static/index.html' in names"
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: macos
          - runner: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: bash scripts/build_release_zip.sh ${{ matrix.platform }}
      - name: Keep ZIP as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lead-Extractor-${{ matrix.platform }}
          path: dist/Lead-Extractor-${{ matrix.platform }}.zip
          if-no-files-found: error
      - name: Attach ZIP to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/Lead-Extractor-${{ matrix.platform }}.zip" --clobber
